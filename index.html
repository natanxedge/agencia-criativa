<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Agência Criativa</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header class="site-header">

        <a
            href="#home"
            class="site-header__logo"
        >

            <img
                src="imagens/spin1x1.png"
                alt="Agência Criativa"
                class="site-header__logo-image"
            >

            <span class="site-header__logo-text">
                Agência Criativa
            </span>

        </a>


        <button
            type="button"
            class="site-header__toggle"
            id="menuSanduiche"
            aria-label="Abrir menu"
            aria-expanded="false"
            aria-controls="menu"
        >

            <span class="site-header__toggle-line"></span>

            <span class="site-header__toggle-line"></span>

            <span class="site-header__toggle-line"></span>

        </button>


        <nav
            class="site-header__menu"
            id="menu"
        >

            <ul class="site-header__menu-list">

                <li class="site-header__menu-item">

                    <a
                        href="#home"
                        data-section="home"
                        class="site-header__menu-link"
                    >
                        Home
                    </a>

                </li>


                <li class="site-header__menu-item">

                    <a
                        href="#sobre"
                        data-section="sobre"
                        class="site-header__menu-link"
                    >
                        Sobre Nós
                    </a>

                </li>


                <li class="site-header__menu-item">

                    <a
                        href="#depoimentos"
                        data-section="depoimentos"
                        class="site-header__menu-link"
                    >
                        Depoimentos
                    </a>

                </li>


                <li class="site-header__menu-item">

                    <a
                        href="#contato"
                        data-section="contato"
                        class="site-header__menu-link"
                    >
                        Contato
                    </a>

                </li>

            </ul>

        </nav>

    </header>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="site-main">


        <div
            class="site-main__content"
            id="conteudo"
        ></div>


        <!-- =========================
             FOOTER
        ========================= -->

        <footer class="site-footer">

            <p>
                &copy; 2026 Agência Criativa.
                Todos os direitos reservados.
            </p>

        </footer>


    </main>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script src="scripts/classes.js"></script>

    <script src="scripts/script.js"></script>


</body>

</html>
